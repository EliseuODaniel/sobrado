<text x="75" y="365" fill="#25312b" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Centro anterior: X=5,35 m. Novo centro: X=1,80 m. Y=3,175 m preservado.</text>
<text x="75" y="405" fill="#25312b" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="start">A base permanece em +5,45 m; a caixa não foi elevada.</text>
<text x="75" y="1310" fill="#25312b" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">O centro novo fica fora da projeção dos dois lances; capacidade mantida em 1.000 L.</text>
<text x="75" y="1350" fill="#25312b" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A forma externa de Ø1,80 m × 1,15 m é ilustrativa, sem fabricante confirmado.</text>
<text x="75" y="1390" fill="#25312b" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A transferência da carga e os novos percursos hidráulicos exigem projeto específico.</text>
