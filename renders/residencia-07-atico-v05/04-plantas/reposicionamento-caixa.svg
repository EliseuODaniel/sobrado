<text x="75" y="1525" fill="#526157" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Linha tracejada: posição original usada nas revisões anteriores. Azul: nova posição proposta.</text>
<text x="75" y="1560" fill="#526157" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">A laje de apoio e a estrutura sob a caixa não foram dimensionadas.</text>
<text x="75" y="1595" fill="#526157" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Na vista lateral, a caixa pode aparecer alinhada em profundidade; conferir esta planta.</text>
